[project]
name = "or-engine"
version = "0.1.0"
description = "Single-day installation-worker dispatch (VRPTW): geocode, cache AMap travel times in PostGIS, solve with OR-Tools, export Excel, served via REST + MCP."
readme = "README.md"
authors = [
     { name = "michael", email = "afmkt1020@proton.me" }
]
requires-python = ">=3.12"
dependencies = [
     "python-dotenv>=1.0.0",
     "fastapi>=0.141.1",
     "uvicorn[standard]>=0.38.0",
     "httpx>=0.28.1",
     "mcp>=2.2.0",
     "pydantic>=2.13.5",
     "pydantic-settings>=2.0",
     "python-multipart>=0.0.9",
     "ortools>=9.15.6755",
     "openpyxl>=3.1.2",
     # data plane
     "asyncpg>=0.30",
]

[project.scripts]
or-engine = "or_engine.main:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
# the project lives under src/
package = true
