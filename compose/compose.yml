#
# or-engine — compose includes (single-day installation dispatch)
#
#   compose up -f compose/compose.yml
#
# Brings up the PostGIS cache and the or-engine service (REST API on
# :8000 and the MCP server as two executables in the same image).
#
name: or-engine

services:
    - ./postgis/compose.yml
    - ./or-engine/compose.yml

volumes:
  postgis_data:
