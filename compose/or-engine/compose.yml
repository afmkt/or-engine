# OR-Engine — REST (OpenAPI) + MCP server, built from the repo Dockerfile.
#
#   cd compose && compose up -d
# or just this service:
#   cd compose && compose -f or-engine/compose.yml up -d

name: or-engine-app

services:
  app:
     # Build the image from the repo root Dockerfile (multi-stage, venv).
    build:
      context: ../..
      dockerfile: Dockerfile
    image: or-engine:latest
    container_name: or_engine_app
    restart: unless-stopped
    environment:
       # Required for Amap geocoding / direction (omit to run in-memory).
      AMAP_API_KEY: ${AMAP_API_KEY:-}
       # PostGIS cache + worker/order store.
      DATABASE_URL: "postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/geospatial_db"
       # REST listen address — published on :8000.
      HOST: "0.0.0.0"
      PORT: "8000"
    depends_on:
      db:
        condition: service_healthy
    ports:
        - "8000:8000"
    networks:
          - default
      # REST health endpoint used by the healthcheck.
      # The engine runs as a plain uvicorn app; no auth front-end in scope.
    healthcheck:
      test:
          - "CMD"
          - "python"
          - "-c"
          - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

networks:
  default:
    driver: bridge
    ipam:
      driver: default
      config:
         - subnet: 172.28.0.0/16
