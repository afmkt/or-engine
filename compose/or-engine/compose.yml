# OR-Engine — combined REST + MCP server.
#
# Pulled from Ali Cloud ACR (CI builds + pushes automatically).
# Image build lives in ../Dockerfile at the repo root; this compose just pulls.
#
# Run with the full stack:
#   cd compose && docker compose up -d

name: or-engine-app

services:
  app:
    image: ${ACR_REGISTRY:-crpi-zuhwpd6fwca3b0fc.cn-shanghai.personal.cr.aliyuncs.com}/${ACR_NAMESPACE:-afmkt}/or-engine:latest
    container_name: or_engine_app
    restart: unless-stopped
    environment:
      AMAP_API_KEY: ${AMAP_API_KEY:?set in .env}
      PGRST_URL: "http://rest:3000"
      # PostgREST runs keyless (PGRST_DB_ANON_ROLE=postgres); no API key needed.
    depends_on:
      rest:
        condition: service_started
    networks:
        - default
    expose:
        - "8000"
    # Caddy's forward_auth gate talks to or-engine:8000.
    # No port published here — Caddy is the public front.
    healthcheck:
      test:
           [
                "CMD",
                "python",
                "-c",
                "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status == 200 else 1)",
           ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

networks:
  default:
    driver: bridge
    ipam:
      driver: default
      config:
           - subnet: 172.28.0.0/16
