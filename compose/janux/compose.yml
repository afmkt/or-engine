# Janux — self-hosted passwordless auth server + OIDC provider.
#
# Pulled from Ali Cloud ACR (CI builds + pushes automatically).
#
# base.toml / seed.toml are per-deployment secrets/config.
# Copy base.example.toml → base.toml and seed.example.toml → seed.toml,
# fill in the placeholders, then run the stack.
#
# Run with the full stack:
#   cd compose && docker compose up -d

name: or-engine-janux

services:
  auth:
    image: ${ACR_REGISTRY:-crpi-zuhwpd6fwca3b0fc.cn-shanghai.personal.cr.aliyuncs.com}/${ACR_NAMESPACE:-afmkt}/janux:latest
    container_name: janux_auth
    restart: unless-stopped
    networks:
        - default
    volumes:
       # janux loads base + seed from its WORKDIR (/app inside the image).
       # data_dir is ./data; mounted to janux_data named volume.
       - ./base.toml:/app/base.toml:ro
       - ./seed.toml:/app/seed.toml:ro
       - janux_data:/app/data
    expose:
       - "8080"
     # Caddy is the only caller of janux:8080 (forward_auth + public surface).
     # No published port — Caddy is the public front.
    healthcheck:
       # 503 unless the server state is injected (needs a populated data dir).
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/v1/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 2G

volumes:
  janux_data:

networks:
  default:
    driver: bridge
    ipam:
      driver: default
      config:
            - subnet: 172.28.0.0/16
